name: Build Android APK + Play AAB

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish this build as a GitHub Release (v + version from package.json)'
        type: boolean
        default: false
  push:
    tags: ['v*']

# أقل صلاحية: البناء يقرأ فقط. صلاحية الكتابة (للنشر) في job منفصل لا يشغّل أي كود من الحزم.
permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    outputs:
      file: ${{ steps.apk.outputs.file }}
      version: ${{ steps.apk.outputs.version }}
      aab: ${{ steps.aab.outputs.file }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_BUILD_NUMBER: ${{ github.run_number }}
      # مجلد android/ محفوظ في المستودع، فلا cap add هنا (يحافظ على الإعدادات والتوقيع)
      - run: npx cap sync android

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is missing. Add the 4 signing secrets in Settings > Secrets and variables > Actions."
            exit 1
          fi
          # يتسامح مع المسافات والأسطر الزائدة التي قد تدخل مع النسخ واللصق
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/release.jks" 2>/dev/null; then
            echo "::error::KEYSTORE_BASE64 is not valid base64 (length after cleanup: $(printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n\t' | wc -c), expected 5764). Paste the whole content of KEYSTORE_BASE64.txt again."
            exit 1
          fi

      - name: Check signing key and passwords
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::Keystore could not be opened. Check KEYSTORE_PASSWORD and KEY_ALIAS secrets."
            exit 1
          fi
          echo "Keystore OK"

      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify signature and name the file
        id: apk
        run: |
          VERSION=$(node -p "require('./package.json').version")
          OUT="ev-dashboard-${VERSION}-${{ github.run_number }}.apk"
          ls -la android/app/build/outputs/apk/release/
          SRC=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$SRC" ]; then echo "::error::Signed APK not found (signing was not applied)"; exit 1; fi
          cp "$SRC" "$OUT"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "Using $APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$OUT" > verify.txt
          grep -v "^WARNING" verify.txt
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # نسخة Google Play: ملف AAB بنفس المفتاح (مفتاح الرفع upload key) ونفس رقم البناء.
      # تُبنى الواجهة من جديد بـ VITE_DISTRIBUTION=play: بدون زر «التحقق من التحديثات» ولا أي اتصال بالإنترنت.
      - name: Build web for Google Play
        run: npm run build && npx cap sync android
        env:
          VITE_BUILD_NUMBER: ${{ github.run_number }}
          VITE_DISTRIBUTION: play

      - name: Build signed release AAB (Google Play)
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Verify AAB signature and name the file
        id: aab
        run: |
          VERSION=$(node -p "require('./package.json').version")
          OUT="ev-dashboard-${VERSION}-${{ github.run_number }}-play.aab"
          SRC=android/app/build/outputs/bundle/release/app-release.aab
          if [ ! -f "$SRC" ]; then echo "::error::Signed AAB not found"; exit 1; fi
          cp "$SRC" "$OUT"
          # jarsigner يتأكد أن الملف موقّع؛ ونطبع بصمة الشهادة لمقارنتها مع بصمة الـ APK (نفس المفتاح)
          jarsigner -verify -certs "$OUT" > aab-verify.txt 2>&1 || { cat aab-verify.txt; echo "::error::AAB signature check failed"; exit 1; }
          grep -q "jar verified" aab-verify.txt || { cat aab-verify.txt; echo "::error::AAB is not signed"; exit 1; }
          unzip -p "$OUT" 'META-INF/*.RSA' 'META-INF/*.EC' 'META-INF/*.DSA' 2>/dev/null | keytool -printcert | grep -E "SHA256|Owner" || true
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: ev-dashboard-apk
          path: ${{ steps.apk.outputs.file }}

      # هذا الملف يُرفع يدوياً إلى Play Console (Testing ▸ Closed testing ▸ Create release)
      - uses: actions/upload-artifact@v4
        with:
          name: ev-dashboard-play-aab
          path: ${{ steps.aab.outputs.file }}

  # النشر: عند tag يبدأ بـ v، أو تشغيل يدوي على main مع publish = true.
  # إن كان الإصدار موجوداً (أُنشئ من صفحة GitHub مثلاً) يُرفع الملف إليه بدل إنشائه من جديد.
  publish:
    needs: apk
    if: startsWith(github.ref, 'refs/tags/v') || (inputs.publish && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ev-dashboard-apk
      # ملف AAB أيضاً في صفحة الإصدار، حتى يُنزَّل كملف عادي من الهاتف (الـ Artifacts تأتي مضغوطة zip)
      - uses: actions/download-artifact@v4
        with:
          name: ev-dashboard-play-aab
      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APK: ${{ needs.apk.outputs.file }}
          AAB: ${{ needs.apk.outputs.aab }}
          VERSION: ${{ needs.apk.outputs.version }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAG="${GITHUB_REF_NAME}"; else TAG="v${VERSION}"; fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$AAB" --clobber
          else
            gh release create "$TAG" "$APK" "$AAB" --title "$TAG" --target "$GITHUB_SHA" --generate-notes
          fi
